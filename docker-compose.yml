version: "3.9"

services:
  backend:
    build: ./backend
    container_name: gridfinity-backend
    # NOTE: this points at the flat backend/main.py, not backend/app/main.py.
    # backend/app/ is a more ambitious (real Wikidata/schema.org/Wikipedia
    # dimension lookup) backend that predates this file, but it currently
    # fails to import - see backend/tests/test_app_package_status.py and
    # the top-level README's Development Roadmap for details.
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: gridfinity-frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
