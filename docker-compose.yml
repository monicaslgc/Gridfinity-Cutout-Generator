version: "3.9"

services:
  backend:
    build: ./backend
    container_name: gridfinity-backend
    # Runs app/main.py - the real Wikidata/schema.org/Wikipedia dimension
    # lookup backend. (It was broken/unimportable for a while and this used
    # to point at the flat backend/main.py mock instead; that's fixed now.)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: gridfinity-frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
